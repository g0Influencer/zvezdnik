# HTTP-only nginx config for local prod-compose dry-run (no TLS).
# Mounted to /etc/nginx/conf.d/default.conf — picked up directly, no envsubst.

upstream app_backend {
    server app:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
    server_tokens off;

    location /api/ {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    location /bot/ {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location = /health {
        proxy_pass http://app_backend/health;
    }

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|map)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
