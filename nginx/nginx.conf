# Site config template for nginx:alpine.
# Bind-mount to /etc/nginx/templates/default.conf.template — envsubst will
# replace ${PROD_DOMAIN} on container startup and place the result in
# /etc/nginx/conf.d/default.conf (picked up by the default nginx.conf).

upstream app_backend {
    server app:8080;
    keepalive 32;
}

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    server_name ${PROD_DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS — single domain serves frontend + API + bot webhook
server {
    listen 443 ssl;
    http2 on;
    server_name ${PROD_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${PROD_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PROD_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;
    server_tokens off;

    # API
    location /api/ {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Telegram bot webhook
    location /bot/ {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Robokassa ResultURL webhook — must reach the Go app, not the SPA fallback.
    location /payments/ {
        proxy_pass         http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Healthcheck passthrough
    location = /health {
        proxy_pass http://app_backend/health;
    }

    # Frontend SPA — static files come from the frontend image
    root /usr/share/nginx/html;
    index index.html;

    # Public offer — clean URL /oferta serves the static oferta.html page.
    location = /oferta {
        try_files /oferta.html =404;
    }

    # Robokassa redirect landing pages (set as Success/Fail URL in the cabinet).
    location = /payment/success {
        try_files /payment-success.html =404;
    }
    location = /payment/fail {
        try_files /payment-fail.html =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
